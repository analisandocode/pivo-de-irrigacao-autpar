<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Monitor de campo ESP32</title>
<style>
  :root {
    --graphite: #14181C;
    --panel: #1B2127;
    --panel-2: #20272E;
    --border: #2A323A;
    --paper: #ECEAE2;
    --muted: #9CA3AA;
    --faint: #6B7280;
    --amber: #FFB020;
    --teal: #3FB8AF;
    --red: #E5484D;
    --mono: 'JetBrains Mono', 'SF Mono', 'Roboto Mono', ui-monospace, 'Cascadia Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--graphite);
    background-image:
      radial-gradient(720px 420px at 50% -10%, rgba(255,176,32,0.07), transparent 70%),
      linear-gradient(rgba(236,234,226,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,234,226,0.025) 1px, transparent 1px);
    background-size: auto, 28px 28px, 28px 28px;
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .signal-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--amber), var(--teal));
    flex-shrink: 0;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 56px;
  }

  .split {
    width: 100%;
    max-width: 940px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 56px;
    align-items: center;
  }

  /* ── coluna esquerda: identidade do equipamento ── */

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
  }

  .brand .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .lede {
    font-size: 14px;
    line-height: 1.65;
    color: var(--muted);
    max-width: 42ch;
    margin: 0 0 28px;
  }

  .channels {
    list-style: none;
    margin: 0 0 26px;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  .channels li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
  }

  .channels .ch-num {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--faint);
    min-width: 46px;
  }

  .channels li:nth-child(1) .ch-num { color: var(--amber); }
  .channels li:nth-child(2) .ch-num { color: var(--teal); }

  .channels .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* assinatura: log de handshake da placa, digitado uma vez no carregamento */
  .handshake {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--faint);
    min-height: 3.8em;
  }

  .handshake b {
    font-weight: 400;
    color: var(--teal);
  }

  .handshake .pending { color: var(--amber); }

  .handshake .line {
    opacity: 0;
    animation: fadeLine 320ms ease-out forwards;
  }

  .handshake .line:nth-child(1) { animation-delay: 120ms; }
  .handshake .line:nth-child(2) { animation-delay: 620ms; }
  .handshake .line:nth-child(3) { animation-delay: 1120ms; }

  @keyframes fadeLine {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }

  .caret {
    display: inline-block;
    width: 7px;
    height: 12px;
    background: var(--amber);
    vertical-align: -1px;
    margin-left: 3px;
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* ── coluna direita: cartão de acesso ── */

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 24px 22px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--amber), var(--teal));
    opacity: 0.55;
  }

  .card .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 8px;
  }

  .card h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  .card p.sub {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 22px;
  }

  /* botão do Google — fundo branco conforme as diretrizes de marca */
  .gbtn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 46px;
    padding: 0 16px;
    border: 1px solid #DADCE0;
    border-radius: 8px;
    background: #FFFFFF;
    color: #1F1F1F;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: box-shadow 150ms ease, transform 120ms ease, background 150ms ease;
  }

  .gbtn:hover { background: #F7F8F8; box-shadow: 0 0 0 4px rgba(236,234,226,0.06); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .gbtn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

  .gbtn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .gbtn .spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(31,31,31,0.2);
    border-top-color: #1F1F1F;
    border-radius: 50%;
    animation: spin 700ms linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .scopes {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    text-align: center;
    margin: 14px 0 0;
    line-height: 1.7;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 16px;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .banner {
    display: none;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 10px 13px;
    border-radius: 8px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-left: 2px solid var(--border);
    color: var(--muted);
    background: var(--panel-2);
  }

  .banner.show { display: block; }
  .banner.erro { border-left-color: var(--red); }
  .banner.aviso { border-left-color: var(--amber); }
  .banner code { font-family: var(--mono); color: var(--amber); font-size: 11.5px; }

  .footnote {
    margin: 22px auto 0;
    max-width: 940px;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--faint);
    text-align: center;
  }

  @media (max-width: 860px) {
    .split { grid-template-columns: 1fr; gap: 34px; max-width: 420px; }
    .handshake { display: none; }
    .stage { padding-top: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .handshake .line { opacity: 1; animation: none; }
    .caret { animation: none; }
    .gbtn .spinner { animation-duration: 2s; }
  }
</style>
</head>
<body>
<div class="signal-bar"></div>

<main class="stage">
  <div class="split">

    <section>
      <div class="brand">
        <span class="eyebrow">ESP32</span>
        <h1>Monitor de campo</h1>
      </div>

      <ul class="channels">
        <li><span class="ch-num">CH.01</span> Temperatura<span class="dot"></span></li>
        <li><span class="ch-num">CH.02</span> Posição GPS<span class="dot"></span></li>
        <li><span class="ch-num">CH.03</span> Câmera<span class="dot"></span></li>
      </ul>

      <div class="handshake" aria-hidden="true">
        <div class="line">placa <b>online</b> · última leitura há 8s</div>
        <div class="line">backend <b>167.126.23.215:5000</b> respondendo</div>
        <div class="line"><span class="pending">aguardando credencial</span><span class="caret"></span></div>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">Acesso</div>
      <h2>Entrar no painel</h2>

      <div class="banner" id="banner" role="status" aria-live="polite"></div>

      <button class="gbtn" id="googleBtn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="googleBtnLabel">Fazer login com o Google</span>
    </button>
    </section>

  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer onerror="gsiFalhou()"></script>
<script>
// ── Configuração ──────────────────────────────────────────────
// GOOGLE_CLIENT_ID: crie um "ID do cliente OAuth 2.0" do tipo Aplicativo da Web
// no Google Cloud Console (APIs e Serviços › Credenciais) e cole aqui. Em
// "Origens JavaScript autorizadas" registre exatamente a origem onde o site é
// servido — ex.: http://localhost:5500 ou https://seu-dominio.com. Arquivo
// aberto direto do disco (file://) NÃO funciona: o Google recusa a origem.
const CONFIG = {
  GOOGLE_CLIENT_ID: '820768517126-imk67jtgqdd5hrbum6v5au9q2mk611vs.apps.googleusercontent.com',
  DESTINO: 'dashboard.html',
};

// Único ponto de controle de quem pode acessar o painel — o Google só confirma
// QUEM a pessoa é, não SE ela pode entrar. Essa checagem é quem decide isso.
const EMAILS_PERMITIDOS = [
  'analiviaalonso3@gmail.com',
  'brunopereira10h7@gmail.com',
];

// Se já tem sessão salva, nem mostra a tela de login.
if (localStorage.getItem('pivo_user')) {
  window.location.replace(CONFIG.DESTINO);
}

const btn = document.getElementById('googleBtn');
const btnLabel = document.getElementById('googleBtnLabel');
const btnIcon = btn.querySelector('svg');
const banner = document.getElementById('banner');

let tokenClient = null;

function mostrarBanner(texto, tipo) {
  banner.innerHTML = texto;
  banner.className = 'banner show ' + (tipo || 'aviso');
}

function limparBanner() {
  banner.className = 'banner';
}

function carregando(ativo) {
  btn.disabled = ativo;
  btnIcon.style.display = ativo ? 'none' : '';
  if (ativo) {
    btnLabel.textContent = 'abrindo o Google…';
    const s = document.createElement('span');
    s.className = 'spinner';
    btn.insertBefore(s, btnLabel);
  } else {
    const s = btn.querySelector('.spinner');
    if (s) s.remove();
    btnLabel.textContent = 'Fazer login com o Google';
  }
}

function gsiFalhou() {
  mostrarBanner('O script do Google não carregou. Verifique a conexão e recarregue a página.', 'erro');
  btn.disabled = true;
}

// ── Fluxo do Google ───────────────────────────────────────────
// Usa o cliente de token do Google Identity Services: o usuário escolhe a
// conta numa janela do Google, voltamos com um access_token e perguntamos ao
// próprio Google quem é o dono dele. A senha nunca passa por esta página.
function iniciarClienteGoogle() {
  if (tokenClient) return true;
  if (!window.google || !google.accounts || !google.accounts.oauth2) return false;

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'openid email profile',
    callback: async (resposta) => {
      if (resposta.error) {
        carregando(false);
        mostrarBanner('O Google recusou o acesso: <code>' + resposta.error + '</code>', 'erro');
        return;
      }
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + resposta.access_token },
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const perfil = await r.json();

        if (!EMAILS_PERMITIDOS.includes(perfil.email)) {
          carregando(false);
          mostrarBanner('Essa conta (<code>' + perfil.email + '</code>) não tem acesso a este painel.', 'erro');
          return;
        }

        entrar({
          nome: perfil.name || perfil.email,
          email: perfil.email,
          foto: perfil.picture,
          // Guardado para quando o Flask passar a validar a sessão (ver SEGURANCA.md).
          token: resposta.access_token,
        });
      } catch (err) {
        console.error('Falha ao ler o perfil do Google:', err);
        carregando(false);
        mostrarBanner('Entramos no Google, mas não deu para ler o perfil. Tente de novo.', 'erro');
      }
    },
    error_callback: (err) => {
      carregando(false);
      // Janela fechada pelo próprio usuário não é erro — não vale assustar ninguém.
      if (err && (err.type === 'popup_closed' || err.type === 'popup_failed_to_open')) {
        limparBanner();
        return;
      }
      mostrarBanner('Não foi possível abrir a janela do Google. Se o navegador bloqueou pop-ups, libere e tente de novo.', 'erro');
    },
  });

  return true;
}

function entrar(usuario) {
  localStorage.setItem('pivo_user', JSON.stringify(usuario));
  btnLabel.textContent = 'entrando…';
  window.location.replace(CONFIG.DESTINO);
}

btn.addEventListener('click', () => {
  limparBanner();

  if (!CONFIG.GOOGLE_CLIENT_ID) {
    mostrarBanner(
      'Falta o ID do cliente. Cole o seu em <code>CONFIG.GOOGLE_CLIENT_ID</code>, no início do script, ' +
      'e registre a origem deste site nas origens autorizadas do Google Cloud Console.',
      'aviso'
    );
    return;
  }

  if (!iniciarClienteGoogle()) {
    mostrarBanner('O script do Google ainda está carregando. Tente novamente em um instante.', 'aviso');
    return;
  }

  carregando(true);
  tokenClient.requestAccessToken({ prompt: 'select_account' });
});
</script>
</body>
</html>
